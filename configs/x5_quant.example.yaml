model_parameters:
  onnx_model: weights/model.onnx
  march: bayes-e
  working_dir: runs/x5_quant_output
  output_model_file_prefix: model_x5_nv12
  layer_out_dump: false

input_parameters:
  input_name: images
  input_type_rt: nv12
  input_type_train: rgb
  input_layout_train: NCHW
  norm_type: data_scale
  scale_value: "0.003921568627451"

calibration_parameters:
  cal_data_dir: calibration_rgb_uint8_nchw
  cal_data_type: uint8
  calibration_type: default

compiler_parameters:
  compile_mode: latency
  debug: false
  jobs: 8
  optimize_level: O3
